<svg width="960" height="190" viewBox="0 0 960 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="960" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#061B2B"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="56" y1="74" x2="860" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7DF1E"/>
      <stop offset="0.25" stop-color="#61DAFB"/>
      <stop offset="0.58" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="4" dy="5" stdDeviation="0.5" flood-color="#1D4ED8" flood-opacity="0.6"/>
      <feDropShadow dx="8" dy="10" stdDeviation="1" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>
    <clipPath id="clip1"><rect x="56" y="78" width="0" height="44"><animate attributeName="width" values="0;760;760;0;0" keyTimes="0;0.10;0.17;0.20;1" dur="24s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip2"><rect x="56" y="78" width="0" height="44"><animate attributeName="width" values="0;0;760;760;0;0" keyTimes="0;0.20;0.30;0.37;0.40;1" dur="24s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip3"><rect x="56" y="78" width="0" height="44"><animate attributeName="width" values="0;0;760;760;0;0" keyTimes="0;0.40;0.50;0.57;0.60;1" dur="24s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip4"><rect x="56" y="78" width="0" height="44"><animate attributeName="width" values="0;0;820;820;0;0" keyTimes="0;0.60;0.70;0.77;0.80;1" dur="24s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip5"><rect x="56" y="78" width="0" height="44"><animate attributeName="width" values="0;0;820;820;0" keyTimes="0;0.80;0.90;0.97;1" dur="24s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="960" height="190" fill="url(#panel)"/>
  <rect x="26" y="24" width="908" height="142" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <circle cx="54" cy="50" r="6" fill="#EF4444"/>
  <circle cx="76" cy="50" r="6" fill="#F7DF1E"/>
  <circle cx="98" cy="50" r="6" fill="#22C55E"/>
  <text x="126" y="56" fill="#64748B" font-family="Consolas, monospace" font-size="14" font-weight="700">intro.rajat</text>

  <g font-family="Consolas, monospace" font-size="28" font-weight="900" filter="url(#lift)">
    <text x="56" y="110" fill="#020617">Hi, I'm Rajat Krishnan.</text>
    <text x="56" y="110" fill="#020617">Integrated MTech CSE @ VIT.</text>
    <text x="56" y="110" fill="#020617">Building PrepPeer and full-stack products.</text>
    <text x="56" y="110" fill="#020617">Exploring AI tools, automation, and data.</text>
    <text x="56" y="110" fill="#020617">Turning ideas into useful shipped projects.</text>
  </g>

  <g font-family="Consolas, monospace" font-size="28" font-weight="900">
    <text x="56" y="110" fill="url(#textGrad)" clip-path="url(#clip1)">Hi, I'm Rajat Krishnan.</text>
    <text x="56" y="110" fill="url(#textGrad)" clip-path="url(#clip2)">Integrated MTech CSE @ VIT.</text>
    <text x="56" y="110" fill="url(#textGrad)" clip-path="url(#clip3)">Building PrepPeer and full-stack products.</text>
    <text x="56" y="110" fill="url(#textGrad)" clip-path="url(#clip4)">Exploring AI tools, automation, and data.</text>
    <text x="56" y="110" fill="url(#textGrad)" clip-path="url(#clip5)">Turning ideas into useful shipped projects.</text>
  </g>

  <rect x="56" y="132" width="848" height="2" fill="#1E293B"/>
  <rect x="56" y="132" width="0" height="2" fill="#61DAFB">
    <animate attributeName="width" values="0;848;0" dur="24s" repeatCount="indefinite"/>
  </rect>
</svg>
