<svg width="960" height="150" viewBox="0 0 960 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="960" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="4" dy="5" stdDeviation="0.5" flood-color="#1D4ED8" flood-opacity="0.55"/>
      <feDropShadow dx="8" dy="10" stdDeviation="1" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>
    <clipPath id="typingClip">
      <rect x="56" y="72" width="0" height="34">
        <animate attributeName="width" values="0;818;818;0;0" keyTimes="0;0.58;0.78;0.98;1" dur="5.4s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="960" height="150" fill="url(#panel)"/>
  <rect x="26" y="24" width="908" height="102" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <circle cx="54" cy="50" r="6" fill="#EF4444"/>
  <circle cx="76" cy="50" r="6" fill="#F7DF1E"/>
  <circle cx="98" cy="50" r="6" fill="#22C55E"/>
  <text x="126" y="56" fill="#64748B" font-family="Consolas, monospace" font-size="14" font-weight="700">about-me.live</text>

  <text x="56" y="98" fill="#111827" font-family="Consolas, monospace" font-size="25" font-weight="900" filter="url(#lift)">I build useful products with AI, web, and data.</text>
  <g clip-path="url(#typingClip)">
    <text x="56" y="98" fill="#E5E7EB" font-family="Consolas, monospace" font-size="25" font-weight="900">I build useful products with AI, web, and data.</text>
  </g>
  <rect x="876" y="75" width="14" height="30" fill="#61DAFB">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="56" y="130" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">PrepPeer · full-stack systems · AI workflows · automation · data experiments</text>
</svg>
