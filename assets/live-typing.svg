<svg width="960" height="190" viewBox="0 0 960 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="960" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#061B2B"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="56" y1="76" x2="784" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7DF1E"/>
      <stop offset="0.26" stop-color="#61DAFB"/>
      <stop offset="0.58" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="4" dy="5" stdDeviation="0.5" flood-color="#1D4ED8" flood-opacity="0.6"/>
      <feDropShadow dx="8" dy="10" stdDeviation="1" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>
    <clipPath id="typingClip">
      <rect x="56" y="78" width="0" height="40">
        <animate attributeName="width" values="0;790;790;0;0" keyTimes="0;0.58;0.78;0.98;1" dur="6.4s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="960" height="190" fill="url(#panel)"/>
  <rect x="26" y="24" width="908" height="142" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <circle cx="54" cy="50" r="6" fill="#EF4444"/>
  <circle cx="76" cy="50" r="6" fill="#F7DF1E"/>
  <circle cx="98" cy="50" r="6" fill="#22C55E"/>
  <text x="126" y="56" fill="#64748B" font-family="Consolas, monospace" font-size="14" font-weight="700">intro.rajat</text>

  <text x="56" y="108" fill="#020617" font-family="Consolas, monospace" font-size="29" font-weight="900" filter="url(#lift)">Hi, I'm Rajat Krishnan - CSE @ VIT.</text>
  <g clip-path="url(#typingClip)">
    <text x="56" y="108" fill="url(#textGrad)" font-family="Consolas, monospace" font-size="29" font-weight="900">Hi, I'm Rajat Krishnan - CSE @ VIT.</text>
  </g>
  <rect x="748" y="82" width="15" height="34" fill="#61DAFB">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="56" y="146" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">I build PrepPeer, full-stack products, AI workflows, automation tools, and data-backed experiments.</text>
</svg>
